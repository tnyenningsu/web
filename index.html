<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>我的模型 AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    #panel {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 24px;
      overflow-y: auto;
      background: #0f172a;
      color: white;
    }

    .card {
      max-width: 440px;
      margin: 40px auto;
    }

    h1 {
      font-size: 28px;
    }

    p {
      line-height: 1.8;
      color: #cbd5e1;
    }

    #message {
      padding: 16px;
      border-radius: 12px;
      background: #1e293b;
      color: #fde68a;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    button {
      padding: 14px 18px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    #startButton {
      width: 100%;
    }

    a {
      color: #93c5fd;
    }

    #hud {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 50;
      max-width: 560px;
      margin: 0 auto;
      padding: 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.9);
      color: white;
    }

    #status {
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      flex: 1;
      padding: 10px 6px;
      background: #334155;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <section id="panel">
    <main class="card">
      <h1>我的模型 AR</h1>

      <p>
        模型會自動從 Google Drive 載入。
        準備完成後，點擊按鈕啟動相機。
      </p>

      <p id="message" role="alert">
        正在載入模型……
      </p>

      <button id="startButton" disabled>
        正在載入模型……
      </button>

      <p>
        啟動後，將鏡頭對準 Hiro 辨識圖。
        請將圖片印出或顯示在另一台裝置上。
      </p>

      <p>
        <a
          href="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png"
          target="_blank"
          rel="noopener noreferrer"
        >
          開啟 Hiro 辨識圖
        </a>
      </p>

      <p>請使用手機 Safari 或 Chrome 開啟。</p>
    </main>
  </section>

  <section id="hud" hidden>
    <div id="status" role="status"></div>

    <div class="controls">
      <button id="smaller">縮小</button>
      <button id="larger">放大</button>
      <button id="rotate">旋轉</button>
      <button id="restart">重來</button>
    </div>
  </section>

  <script>
    // 唯一需要修改的設定：
    // 填入你的 GAS 網頁應用程式 /exec 網址。
    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbzWtVthjostnFAHWRHQ4iYmTRRSAEDqNdtAy3rbhqc0Kygt6EKMeT2iqW8vGptf_xNHKQ/exec";

    const panel = document.getElementById("panel");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const hud = document.getElementById("hud");
    const statusBox = document.getElementById("status");

    let modelUrl = "";
    let downloadFinished = false;
    let downloadTimer = null;

    let scene = null;
    let holder = null;

    let started = false;
    let failed = false;
    let cameraReady = false;
    let modelReady = false;
    let markerVisible = false;

    let displayScale = 1;
    let rotationDegrees = 0;

    function stopCamera() {
      document.querySelectorAll("video").forEach((video) => {
        const stream = video.srcObject;

        if (stream && typeof stream.getTracks === "function") {
          stream.getTracks().forEach((track) => track.stop());
        }
      });
    }

    function fail(text) {
      if (failed) return;

      failed = true;

      clearTimeout(downloadTimer);

      panel.hidden = false;
      hud.hidden = true;
      message.textContent = text;

      startButton.disabled = false;
      startButton.textContent = "重新載入並重試";

      if (scene) {
        scene.pause();
      }

      stopCamera();
    }

    function updateStatus() {
      if (failed) return;

      if (!cameraReady) {
        statusBox.textContent =
          "正在啟動相機，請允許相機權限。";
      } else if (!modelReady) {
        statusBox.textContent =
          "正在解析 3D 模型，請稍候。";
      } else if (markerVisible) {
        statusBox.textContent =
          "已辨識！正在顯示你的模型。";
      } else {
        statusBox.textContent =
          "請將鏡頭對準完整 Hiro 辨識圖。";
      }
    }

    // GAS 會呼叫這個固定名稱的函式。
    window.receiveARModel = function (data) {
      if (downloadFinished || failed) return;

      downloadFinished = true;
      clearTimeout(downloadTimer);

      try {
        if (!data || data.ok !== true) {
          throw new Error(
            data?.error || "GAS 未回傳有效模型。"
          );
        }

        const size = Number(data.size);
        const maxBytes = 8 * 1024 * 1024;

        if (
          !Number.isInteger(size) ||
          size < 12 ||
          size > maxBytes ||
          typeof data.base64 !== "string" ||
          data.base64.length > 4 * Math.ceil(maxBytes / 3)
        ) {
          throw new Error("模型資料大小無效。");
        }

        const binary = atob(data.base64);

        if (binary.length !== size) {
          throw new Error("模型傳輸不完整。");
        }

        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        if (
          bytes[0] !== 103 ||
          bytes[1] !== 108 ||
          bytes[2] !== 84 ||
          bytes[3] !== 70
        ) {
          throw new Error("收到的檔案不是 GLB。");
        }

        const blob = new Blob(
          [bytes],
          { type: "model/gltf-binary" }
        );

        modelUrl = URL.createObjectURL(blob);

        message.textContent =
          "模型已下載：" + String(data.name) +
          "\n大小：" +
          (size / 1024 / 1024).toFixed(2) +
          " MB\n請點擊下方按鈕。";

        startButton.disabled = false;
        startButton.textContent = "啟動 AR 相機";
      } catch (error) {
        console.error(error);
        fail(error.message || "模型下載失敗。");
      }
    };

    function loadDriveModel() {
      let endpoint;

      try {
        endpoint = new URL(GAS_URL);

        if (
          endpoint.protocol !== "https:" ||
          endpoint.hostname !== "script.google.com" ||
          !/^\/macros\/s\/[^/]+\/exec$/.test(endpoint.pathname)
        ) {
          throw new Error("網址格式不符");
        }
      } catch {
        fail(
          "請先在程式的 GAS_URL 填入有效的 GAS /exec 部署網址。"
        );
        return;
      }

      // JSONP 以 script 載入，不直接 fetch Drive 分享連結。
      const script = document.createElement("script");
      script.async = true;
      script.src = endpoint.href;

      script.onerror = () => {
        if (downloadFinished) return;

        fail(
          "無法連線到 GAS。\n" +
          "請確認部署網址結尾是 /exec，" +
          "且存取權設為「所有人」。"
        );
      };

      downloadTimer = setTimeout(() => {
        if (downloadFinished) return;

        fail(
          "模型下載逾時。\n" +
          "請確認網路、GAS 公開部署設定，" +
          "並先執行 GAS 的 testModelAccess 測試。"
        );
      }, 90000);

      document.head.appendChild(script);
    }

    window.addEventListener("camera-init", () => {
      if (failed) {
        stopCamera();
        return;
      }

      cameraReady = true;
      updateStatus();
    });

    window.addEventListener("camera-error", (event) => {
      console.error("相機錯誤", event.detail);

      fail(
        "相機啟動失敗。\n" +
        "請確認已允許相機，並使用 Safari 或 Chrome。\n" +
        "請直接開啟 GitHub Pages 網址。"
      );
    });

    startButton.addEventListener("click", () => {
      if (failed || started) {
        location.reload();
        return;
      }

      if (!modelUrl) return;

      if (
        !window.isSecureContext ||
        !navigator.mediaDevices?.getUserMedia
      ) {
        fail(
          "目前環境無法使用相機。\n" +
          "請用 Safari 或 Chrome 開啟 HTTPS 網址。"
        );
        return;
      }

      if (!window.AFRAME || !AFRAME.systems.arjs) {
        fail("AR 套件載入失敗，請確認網路後重試。");
        return;
      }

      started = true;
      startButton.disabled = true;
      panel.hidden = true;
      hud.hidden = false;

      updateStatus();

      scene = document.createElement("a-scene");

      scene.setAttribute("embedded", "");
      scene.setAttribute("vr-mode-ui", "enabled: false");

      scene.setAttribute(
        "renderer",
        "alpha: true; antialias: true; precision: medium"
      );

      scene.setAttribute(
        "arjs",
        "sourceType: webcam; debugUIEnabled: false;"
      );

      scene.innerHTML = `
        <a-marker
          id="marker"
          preset="hiro"
          emitevents="true"
        >
          <a-entity id="holder">
            <a-entity id="model"></a-entity>
          </a-entity>
        </a-marker>

        <a-entity
          light="type: ambient; intensity: 1"
        ></a-entity>

        <a-entity
          light="type: directional; intensity: 1"
          position="1 3 2"
        ></a-entity>

        <a-entity camera></a-entity>
      `;

      const marker = scene.querySelector("#marker");
      const modelEntity = scene.querySelector("#model");

      holder = scene.querySelector("#holder");

      marker.addEventListener("markerFound", () => {
        markerVisible = true;
        updateStatus();
      });

      marker.addEventListener("markerLost", () => {
        markerVisible = false;
        updateStatus();
      });

      modelEntity.addEventListener("model-loaded", () => {
        if (failed) return;

        try {
          const mesh = modelEntity.getObject3D("mesh");

          if (!mesh) {
            throw new Error("找不到模型內容");
          }

          // 使用未放入 AR 場景的副本計算模型本身尺寸，
          // 避免辨識圖的位置影響自動縮放。
          const measuringCopy = mesh.clone(true);
          measuringCopy.updateMatrixWorld(true);

          const bounds = new AFRAME.THREE.Box3()
            .setFromObject(measuringCopy);

          if (bounds.isEmpty()) {
            throw new Error("模型沒有可顯示的內容");
          }

          const dimensions = bounds.getSize(
            new AFRAME.THREE.Vector3()
          );

          const center = bounds.getCenter(
            new AFRAME.THREE.Vector3()
          );

          const longestSide = Math.max(
            dimensions.x,
            dimensions.y,
            dimensions.z
          );

          if (
            !Number.isFinite(longestSide) ||
            longestSide <= 0
          ) {
            throw new Error("模型尺寸無效");
          }

          const fitScale = 1.5 / longestSide;

          modelEntity.object3D.scale.setScalar(fitScale);

          modelEntity.object3D.position.set(
            -center.x * fitScale,
            -bounds.min.y * fitScale,
            -center.z * fitScale
          );

          modelReady = true;
          updateStatus();
        } catch (error) {
          console.error(error);

          fail(
            "模型解析失敗。\n" +
            "請確認 GLB 包含有效的 3D 物件。"
          );
        }
      });

      modelEntity.addEventListener("model-error", (event) => {
        console.error("模型錯誤", event.detail);

        fail(
          "模型載入失敗。\n" +
          "請使用包含材質、貼圖的完整 GLB。\n" +
          "若使用特殊壓縮，請先匯出成未壓縮 GLB 測試。"
        );
      });

      modelEntity.setAttribute(
        "gltf-model",
        "url(" + modelUrl + ")"
      );

      document.body.appendChild(scene);
    });

    document.getElementById("smaller")
      .addEventListener("click", () => {
        if (!modelReady) return;

        displayScale = Math.max(0.1, displayScale / 1.2);
        holder.object3D.scale.setScalar(displayScale);
      });

    document.getElementById("larger")
      .addEventListener("click", () => {
        if (!modelReady) return;

        displayScale = Math.min(10, displayScale * 1.2);
        holder.object3D.scale.setScalar(displayScale);
      });

    document.getElementById("rotate")
      .addEventListener("click", () => {
        if (!modelReady) return;

        rotationDegrees = (rotationDegrees + 45) % 360;

        holder.object3D.rotation.y =
          AFRAME.THREE.MathUtils.degToRad(rotationDegrees);
      });

    document.getElementById("restart")
      .addEventListener("click", () => {
        stopCamera();
        location.reload();
      });

    window.addEventListener("pagehide", () => {
      stopCamera();

      if (modelUrl) {
        URL.revokeObjectURL(modelUrl);
      }
    });

    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        location.reload();
      }
    });

    // 開啟網站後，自動下載指定模型。
    loadDriveModel();
  </script>
</body>
</html>
